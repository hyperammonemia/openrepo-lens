name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Rebuild from saved responses
        run: |
          python pipeline.py analyze
          python build.py
          python make_report.py
      - name: Verify metrics and evidence
        run: python -m unittest discover -s tests -v
      - name: Verify the static demo matches the rebuilt output
        run: python -c "from pathlib import Path; assert Path('docs/index.html').read_bytes() == Path('output/index.html').read_bytes()"
